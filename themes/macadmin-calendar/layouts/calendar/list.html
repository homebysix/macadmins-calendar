{{ define "main" }}
<div class="calendar-page">
    <h1>{{ .Title }}</h1>
    {{ .Content }}

    <div class="calendar-controls">
        <h2 id="currentMonth"></h2>
        <div class="calendar-nav">
            <button id="prevMonth" type="button" aria-label="Previous month">&lt; Previous</button>
            <button id="todayButton" type="button" class="today-btn">Today</button>
            <button id="nextMonth" type="button" aria-label="Next month">Next &gt;</button>
        </div>
    </div>

    <div class="calendar-view">
        <div class="calendar-grid" id="calendarGrid">
            <!-- Calendar will be generated by JavaScript -->
        </div>
    </div>

    <section class="selected-event-details" id="eventDetails" tabindex="-1" aria-labelledby="eventDetailsHeading" style="display: none;">
        <h3 id="eventDetailsHeading">Event Details</h3>
        <div id="eventContent"></div>
    </section>
</div>

<script>
const events = [
    {{ range .Site.Data.events.events }}
    {
        name: "{{ .name }}",
        full_name: "{{ .full_name | default .name }}",
        start_date: "{{ .start_date }}",
        end_date: "{{ .end_date | default .start_date }}",
        location: "{{ .location }}",
        website: "{{ .website }}",
        type: "{{ .type }}",
        videos: "{{ .videos | default "" }}",
        archive: "{{ .archive | default "" }}"
    },
    {{ end }}
];

const DAY_MS = 86400000;

function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
}

function atMidnight(d) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

const today = new Date();
const todayStart = atMidnight(today);
let currentDate = new Date();

const parsedEvents = events.map(e => ({
    data: e,
    start: parseDate(e.start_date),
    end: parseDate(e.end_date),
}));

function renderCalendar(year, month) {
    const firstOfMonth = new Date(year, month, 1);
    const lastOfMonth = new Date(year, month + 1, 0);
    const gridStart = new Date(firstOfMonth);
    gridStart.setDate(gridStart.getDate() - firstOfMonth.getDay());

    const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];

    document.getElementById('currentMonth').textContent =
        `${monthNames[month]} ${year}`;

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    const headers = document.createElement('div');
    headers.className = 'calendar-headers';
    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
        const header = document.createElement('div');
        header.className = 'calendar-day-header';
        header.textContent = day;
        headers.appendChild(header);
    });
    grid.appendChild(headers);

    const cursor = new Date(gridStart);
    while (cursor <= lastOfMonth || cursor.getDay() !== 0) {
        grid.appendChild(buildWeek(new Date(cursor), month));
        cursor.setDate(cursor.getDate() + 7);
    }
}

function buildWeek(weekStart, displayedMonth) {
    const weekEl = document.createElement('div');
    weekEl.className = 'calendar-week';

    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekEnd.getDate() + 6);

    const weekEvents = parsedEvents.filter(pe => pe.end >= weekStart && pe.start <= weekEnd);

    for (let i = 0; i < 7; i++) {
        const day = new Date(weekStart);
        day.setDate(day.getDate() + i);
        weekEl.appendChild(buildDayCell(day, displayedMonth, weekEvents));
    }

    weekEl.appendChild(buildBarsLayer(weekStart, weekEnd, weekEvents));
    return weekEl;
}

function buildDayCell(day, displayedMonth, weekEvents) {
    const cell = document.createElement('div');
    cell.className = 'calendar-day';
    if (day.getMonth() !== displayedMonth) cell.classList.add('other-month');

    const dayNumber = document.createElement('div');
    dayNumber.className = 'day-number';
    dayNumber.textContent = day.getDate();
    cell.appendChild(dayNumber);

    weekEvents.forEach(pe => {
        if (day >= pe.start && day <= pe.end) {
            cell.appendChild(buildEventButton(pe, 'mobile-pill'));
        }
    });

    return cell;
}

function buildBarsLayer(weekStart, weekEnd, weekEvents) {
    const layer = document.createElement('div');
    layer.className = 'calendar-week-bars';

    const entries = weekEvents.map(pe => {
        const clippedStart = pe.start < weekStart ? weekStart : pe.start;
        const clippedEnd = pe.end > weekEnd ? weekEnd : pe.end;
        return {
            pe,
            startCol: clippedStart.getDay() + 1,
            span: Math.round((clippedEnd - clippedStart) / DAY_MS) + 1,
        };
    });

    entries.sort((a, b) => a.startCol - b.startCol || b.span - a.span);

    const laneEnds = [];
    entries.forEach(entry => {
        let lane = 0;
        while (lane < laneEnds.length && laneEnds[lane] >= entry.startCol) lane++;
        laneEnds[lane] = entry.startCol + entry.span - 1;

        const bar = buildEventButton(entry.pe, 'calendar-event-bar');
        bar.style.setProperty('--start', entry.startCol);
        bar.style.setProperty('--span', entry.span);
        bar.style.setProperty('--lane', lane);
        layer.appendChild(bar);
    });

    return layer;
}

function buildEventButton(pe, modifier) {
    const event = pe.data;
    const isUpcoming = pe.end >= todayStart;
    const status = isUpcoming ? 'upcoming' : 'past';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `calendar-event ${modifier} ${status}`;
    if (pe.end > pe.start) btn.classList.add('multi-day');
    btn.textContent = event.name;
    btn.setAttribute('aria-label', `${isUpcoming ? 'Upcoming' : 'Past'}: ${event.full_name || event.name}, ${event.location}`);
    btn.addEventListener('click', () => showEventDetails(event));
    return btn;
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showEventDetails(event) {
    const details = document.getElementById('eventDetails');
    const content = document.getElementById('eventContent');

    const startDate = parseDate(event.start_date);
    const endDate = parseDate(event.end_date);
    const dateStr = startDate.toDateString() === endDate.toDateString()
        ? startDate.toLocaleDateString()
        : `${startDate.toLocaleDateString()} - ${endDate.toLocaleDateString()}`;

    const name = escapeHtml(event.name);
    const fullName = escapeHtml(event.full_name || event.name);
    const website = encodeURI(event.website);
    const videos = event.videos ? encodeURI(event.videos) : '';
    const archive = event.archive ? encodeURI(event.archive) : '';
    const titleContent = event.full_name && event.full_name !== event.name
        ? `${fullName}<br><small>(${name})</small>`
        : name;

    content.innerHTML = `
        <h4><a href="${website}" target="_blank" rel="noopener noreferrer">${titleContent}</a></h4>
        <p><strong><span aria-hidden="true">📅</span> Date:</strong> ${escapeHtml(dateStr)}</p>
        <p><strong><span aria-hidden="true">📍</span> Location:</strong> ${escapeHtml(event.location)}</p>
        <p><strong><span aria-hidden="true">🏷️</span> Type:</strong> ${escapeHtml(event.type)}</p>
        <div class="event-actions">
            <a href="${website}" target="_blank" rel="noopener noreferrer" class="btn btn-primary"><span aria-hidden="true">🌐</span> Website</a>
            ${videos ? `<a href="${videos}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"><span aria-hidden="true">📹</span> Videos</a>` : ''}
            ${archive ? `<a href="${archive}" target="_blank" rel="noopener noreferrer" class="btn btn-secondary"><span aria-hidden="true">📚</span> Archive</a>` : ''}
        </div>
    `;

    details.style.display = 'block';
    details.scrollIntoView({ behavior: 'smooth' });
    details.focus();
}

document.getElementById('prevMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
});

document.getElementById('nextMonth').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
});

document.getElementById('todayButton').addEventListener('click', () => {
    currentDate = new Date(today);
    renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
});

renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
</script>

{{ end }}
