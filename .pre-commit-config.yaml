exclude: |
  (?x)^(
    public/|
    site/|
    build/|
    resources/_gen/|
    \.hugo_build\.lock
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: validate-events
        name: Validate events.yaml
        entry: scripts/validate_events.py
        language: python
        additional_dependencies: ["pyyaml"]
        files: ^(data/events\.yaml|scripts/validate_events\.py)$
        pass_filenames: false
